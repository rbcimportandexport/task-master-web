<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="todo_list">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Task Master - Warehouse Workspace</title>
  <link rel="manifest" href="manifest.json">
  <!-- Google Fonts: Inter & Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Custom Modern Desktop Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>
</head>
<body>
  <script>
    window._speechResult = '';
    window._speechStatus = 'idle';
    window._speechActive = false;

    var _recog = null;
    var _micStream = null;
    var _accumulatedText = '';
    var _interimText = '';

    window.initSpeechRecognition = function(lang) {
      window._speechResult = '';
      window._speechStatus = 'starting';
      window._speechActive = true;
      _accumulatedText = '';
      _interimText = '';
      sessionStorage.setItem('latest_speech_result', '');

      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        window._speechStatus = 'not_supported';
        window.dispatchEvent(new CustomEvent('flutter_speech_status', { detail: 'not_supported' }));
        return false;
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(function(stream) {
            _micStream = stream;
            _startEngine(SR, lang);
          })
          .catch(function(err) {
            console.warn('Microphone permission notice:', err);
            _startEngine(SR, lang);
          });
      } else {
        _startEngine(SR, lang);
      }
      return true;
    };

    function _startEngine(SR, lang) {
      if (!window._speechActive) return;

      if (_recog) {
        try { _recog.abort(); } catch(e) {}
        _recog = null;
      }

      try {
        _recog = new SR();
        _recog.continuous = true; // Use continuous to prevent rapid onend loops
        _recog.interimResults = true;
        _recog.maxAlternatives = 1;
        _recog.lang = lang || 'en-US'; // Force English/Roman script transcription

        _recog.onstart = function() {
          window._speechStatus = 'listening';
          window.dispatchEvent(new CustomEvent('flutter_speech_status', { detail: 'listening' }));
          console.log('🎤 Speech listener active. Lang:', _recog.lang);
        };

        _recog.onresult = function(event) {
          var currentPhrase = '';
          for (var i = 0; i < event.results.length; ++i) {
            currentPhrase += event.results[i][0].transcript + ' ';
          }
          var text = (_accumulatedText + ' ' + currentPhrase).trim();
          window._speechResult = text;
          sessionStorage.setItem('latest_speech_result', text);
          console.log('🎤 Heard:', text);
          
          window.dispatchEvent(new CustomEvent('flutter_speech_result', { detail: text }));
        };

        _recog.onerror = function(e) {
          if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
            window._speechActive = false;
            window._speechStatus = 'error:not-allowed';
            window.dispatchEvent(new CustomEvent('flutter_speech_status', { detail: 'error:not-allowed' }));
          }
        };

        _recog.onend = function() {
          if (window._speechActive) {
            // Save the current phrase into accumulated before restarting
            _accumulatedText = window._speechResult + ' ';
            setTimeout(function() {
              if (window._speechActive) {
                _startEngine(SR, lang);
              }
            }, 400);
          } else {
            window._speechStatus = 'ended';
            window.dispatchEvent(new CustomEvent('flutter_speech_status', { detail: 'ended' }));
          }
        };

        _recog.start();
      } catch (err) {
        console.error('Speech recognition start failed:', err);
        window._speechStatus = 'error';
      }
    }

    window.stopSpeechRecognition = function() {
      window._speechActive = false;
      window._speechStatus = 'ended';
      if (_micStream) {
        try { _micStream.getTracks().forEach(function(t) { t.stop(); }); } catch(e) {}
        _micStream = null;
      }
      if (_recog) {
        try { _recog.stop(); } catch(e) { try { _recog.abort(); } catch(err){} }
        _recog = null;
      }
    };

    window.getSpeechResult = function() { return window._speechResult || ''; };
    window.getSpeechStatus = function() { return window._speechStatus || 'idle'; };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
